name: Package SRAM Analysis Tool
on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package versioned ZIP
        run: python tools/package_release.py
      - name: Verify ZIP contents and version
        run: |
          python - <<'PY'
          import pathlib, zipfile
          version = pathlib.Path("VERSION").read_text().strip()
          name = f"SRAM Analysis Tool v{version}"
          path = pathlib.Path("releases") / f"{name}.zip"
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              names = set(archive.namelist())
              for file in ("VERSION", "engine.py", "web/app.js", "pattern_reports.py", "Start SRAM Wafer Studio.cmd", "examples/sim128/SIM128_WT1.asc"):
                  assert f"{name}/{file}" in names, file
              assert archive.read(f"{name}/VERSION").decode().strip() == version
          print("Verified:", path)
          PY
      - name: Commit only new version ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/SRAM Analysis Tool v$(cat VERSION).zip"
          git diff --cached --quiet || (git commit -m "release: package SRAM Analysis Tool v$(cat VERSION)" && git push)
